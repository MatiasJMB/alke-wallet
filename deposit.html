<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Realiza un depósito de fondos en tu cuenta Alke Wallet." />
  <title>Depositar — Alke Wallet</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-lg panel-dark navbar-dark sticky-top">
      <div class="container">
        <a class="navbar-brand brand-logo" href="menu.html">
          <span class="brand-mark">A</span> Alke Wallet
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
          data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false"
          aria-label="Abrir menú de navegación">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="menu.html">Inicio</a></li>
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="deposit.html">Depositar</a></li>
            <li class="nav-item"><a class="nav-link" href="withdraw.html">Retirar</a></li>
            <li class="nav-item"><a class="nav-link" href="sendmoney.html">Enviar dinero</a></li>
            <li class="nav-item"><a class="nav-link" href="transactions.html">Movimientos</a></li>
          </ul>
          <div class="d-flex align-items-center gap-3">
            <span class="text-white-50">Hola, <strong class="text-white" data-user-name>Usuario</strong></span>
            <button id="logoutBtn" type="button" class="btn btn-outline-light btn-sm">Salir</button>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <main class="container py-4 py-lg-5">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="menu.html">Inicio</a></li>
        <li class="breadcrumb-item active" aria-current="page">Depositar</li>
      </ol>
    </nav>

    <div class="row g-4 justify-content-center">
      <div class="col-lg-7">
        <div class="card-soft p-4 p-md-5">
          <h1 class="h4 fw-bold mb-1">Realizar un depósito</h1>
          <p class="text-muted">Agrega fondos a tu billetera de forma instantánea.</p>

          <div class="panel-dark rounded-3 p-3 mb-4 d-flex justify-content-between align-items-center">
            <span class="opacity-75">Saldo actual</span>
            <span class="h4 mb-0 fw-bold" id="currentBalance">$0</span>
          </div>

          <div id="depositAlert" class="alert d-none" role="alert"></div>

          <form id="depositForm" novalidate>
            <div class="mb-3">
              <label for="depositAmount" class="form-label">Monto a depositar</label>
              <div class="input-group">
                <span class="input-group-text">$</span>
                <input type="number" class="form-control" id="depositAmount"
                  placeholder="0" min="1" step="1" required />
                <div class="invalid-feedback">Ingresa un monto válido mayor a cero.</div>
              </div>
            </div>

            <div class="mb-3 d-flex flex-wrap gap-2" id="quickAmounts">
              <button type="button" class="btn btn-outline-secondary btn-sm" data-amount="10000">+ $10.000</button>
              <button type="button" class="btn btn-outline-secondary btn-sm" data-amount="20000">+ $20.000</button>
              <button type="button" class="btn btn-outline-secondary btn-sm" data-amount="50000">+ $50.000</button>
              <button type="button" class="btn btn-outline-secondary btn-sm" data-amount="100000">+ $100.000</button>
            </div>

            <div class="mb-4">
              <label for="depositConcept" class="form-label">Concepto (opcional)</label>
              <input type="text" class="form-control" id="depositConcept"
                placeholder="Ej: Recarga mensual" maxlength="60" />
            </div>

            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-brand py-2 px-4">Realizar depósito</button>
              <a href="menu.html" class="btn btn-light py-2 px-4">Cancelar</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"
  ></script>
  <script
    src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous"
  ></script>
  <script src="js/store.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/session.js"></script>
  <script src="js/deposit.js"></script>
</body>
</html>
