<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Historial completo de tus movimientos en Alke Wallet." />
  <title>Movimientos — Alke Wallet</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-lg panel-dark navbar-dark sticky-top">
      <div class="container">
        <a class="navbar-brand brand-logo" href="menu.html">
          <span class="brand-mark">A</span> Alke Wallet
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
          data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false"
          aria-label="Abrir menú de navegación">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="menu.html">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="deposit.html">Depositar</a></li>
            <li class="nav-item"><a class="nav-link" href="withdraw.html">Retirar</a></li>
            <li class="nav-item"><a class="nav-link" href="sendmoney.html">Enviar dinero</a></li>
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="transactions.html">Movimientos</a></li>
          </ul>
          <div class="d-flex align-items-center gap-3">
            <span class="text-white-50">Hola, <strong class="text-white" data-user-name>Usuario</strong></span>
            <button id="logoutBtn" type="button" class="btn btn-outline-light btn-sm">Salir</button>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <main class="container py-4 py-lg-5">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="menu.html">Inicio</a></li>
        <li class="breadcrumb-item active" aria-current="page">Movimientos</li>
      </ol>
    </nav>

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
      <h1 class="h4 fw-bold mb-0">Últimos movimientos</h1>

      <div class="btn-group" role="group" aria-label="Filtrar movimientos" id="txFilters">
        <button type="button" class="btn btn-sm btn-brand" data-filter="all">Todos</button>
        <button type="button" class="btn btn-sm btn-outline-secondary" data-filter="in">Ingresos</button>
        <button type="button" class="btn btn-sm btn-outline-secondary" data-filter="out">Egresos</button>
      </div>
    </div>

    <div class="row g-3 mb-4">
      <div class="col-md-4">
        <div class="card-soft p-3">
          <p class="small text-muted mb-1">Saldo actual</p>
          <p class="h5 fw-bold mb-0" id="balanceAmount">$0</p>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card-soft p-3">
          <p class="small text-muted mb-1">Ingresos</p>
          <p class="h5 fw-bold amount-in mb-0" id="totalIn">$0</p>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card-soft p-3">
          <p class="small text-muted mb-1">Egresos</p>
          <p class="h5 fw-bold amount-out mb-0" id="totalOut">$0</p>
        </div>
      </div>
    </div>

    <div class="card-soft p-2 p-md-3">
      <div class="table-responsive">
        <table class="table align-middle mb-0">
          <thead>
            <tr class="text-muted small">
              <th scope="col">Tipo</th>
              <th scope="col">Concepto</th>
              <th scope="col">Detalle</th>
              <th scope="col">Fecha</th>
              <th scope="col" class="text-end">Monto</th>
            </tr>
          </thead>
          <tbody id="txTableBody"></tbody>
        </table>
      </div>
      <div id="emptyState" class="empty-state d-none">
        <p class="mb-0">No hay movimientos para mostrar.</p>
      </div>
    </div>
  </main>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"
  ></script>
  <script
    src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous"
  ></script>
  <script src="js/store.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/session.js"></script>
  <script src="js/transactions.js"></script>
</body>
</html>
